<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mapa interactivo San Borja</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet"/>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0e1118;
  --panel:   #161b26;
  --panel2:  #1c2333;
  --border:  #252d3d;
  --text:    #cdd5e0;
  --muted:   #5a6478;
  --radius:  10px;
  --mono:    'DM Mono', monospace;
  --sans:    'DM Sans', sans-serif;
  --blue:    #3b8de8;
  --indigo:  #6b5de8;
  --green:   #27a86e;
  --red:     #e05252;

  --s1:#e05252; --s2:#e07c3a; --s3:#d4b800; --s4:#6abf4b;
  --s5:#27a86e; --s6:#1ea8a8; --s7:#3b8de8; --s8:#6b5de8;
  --s9:#a34de8; --s10:#e04da8; --s11:#e84d6b; --s12:#7a9e6e;
}

html, body { height:100%; font-family:var(--sans); background:var(--bg); color:var(--text); overflow:hidden; position:relative; }

/* ── LAYOUT ── */
.app { height:100vh; position:relative; }

.menu-btn {
  display:none;
}

.sidebar-header {
  display:none;
}

.menu-close {
  display:none;
}

#sidebar-backdrop {
  display:none;
}

aside {
  display:none;
}

body.sidebar-open aside {
  display:none;
}
body.sidebar-open #sidebar-backdrop {
  display:none;
}

/* ── HEADER ── */
header {
  position:fixed; top:0; left:0; right:0; z-index:10;
  display:flex; flex-direction:column;
  background:var(--panel); border-bottom:1px solid var(--border);
  height:100px; box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.header-top {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px; height:50px;
}
.header-legend {
  padding:8px 18px; border-top:1px solid var(--border);
  display:flex; align-items:center; gap:12px; height:50px;
}
.header-legend .blk-title { margin:0; font-size:11px; }
.header-legend .leg-grid { display:flex; gap:8px; flex-wrap:wrap; }

/* ── SIDEBAR ── */
aside { background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }

.blk { padding:14px 16px; border-bottom:1px solid var(--border); }
.blk-title { font-size:9px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin-bottom:10px; }

/* ── TABS de fuente ── */
.source-tabs { display:flex; gap:4px; margin-bottom:12px; }
.stab {
  flex:1; padding:7px 4px; border-radius:7px; border:1px solid var(--border);
  background:transparent; color:var(--muted); font-family:var(--sans); font-size:11px;
  font-weight:600; cursor:pointer; transition:all .15s; text-align:center;
}
.stab.active { background:var(--panel2); border-color:var(--blue); color:var(--text); }

/* ── Fuente: Google Sheets ── */
#src-sheets { display:flex; flex-direction:column; gap:8px; }
.gs-input-wrap { position:relative; }
.gs-input-wrap input {
  width:100%; background:var(--bg); border:1px solid var(--border);
  border-radius:7px; color:var(--text); font-family:var(--mono); font-size:11px;
  padding:8px 10px; outline:none; transition:border-color .2s;
}
.gs-input-wrap input:focus { border-color:var(--blue); }
.gs-input-wrap input::placeholder { color:var(--muted); }
.gs-hint {
  font-size:10px; color:var(--muted); font-family:var(--mono); line-height:1.5;
  background:var(--panel2); border-radius:7px; padding:8px 10px;
  border:1px solid var(--border);
}
.gs-hint b { color:var(--text); }
#gs-status { font-size:11px; font-family:var(--mono); min-height:16px; }
#gs-status.ok  { color:var(--green); }
#gs-status.err { color:var(--red);   }
#gs-status.loading { color:var(--blue); }

/* ── Fuente: Archivo local ── */
#src-file { display:none; }
.dz {
  border:1.5px dashed var(--border); border-radius:var(--radius);
  padding:16px 12px; text-align:center; cursor:pointer;
  transition:border-color .2s,background .2s; position:relative;
}
.dz:hover,.dz.over { border-color:var(--blue); background:rgba(59,141,232,.05); }
.dz input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.dz-ico { font-size:22px; margin-bottom:4px; }
.dz-lbl { font-size:12px; font-weight:600; }
.dz-sub { font-size:10px; color:var(--muted); font-family:var(--mono); margin-top:2px; }
#fstatus { font-size:11px; font-family:var(--mono); min-height:16px; margin-top:8px; }
#fstatus.ok  { color:var(--green); }
#fstatus.err { color:var(--red);   }

/* ── Selector columna sector ── */
.field { display:flex; flex-direction:column; gap:5px; }
.field label { font-size:11px; color:var(--muted); }
.field select {
  background:var(--bg); border:1px solid var(--border);
  border-radius:7px; color:var(--text); font-family:var(--mono);
  font-size:12px; padding:7px 10px; outline:none;
  transition:border-color .2s; width:100%;
}
.field select:focus { border-color:var(--blue); }

/* ── Botones ── */
.btn {
  width:100%; padding:9px; border-radius:var(--radius); border:none;
  font-family:var(--sans); font-size:13px; font-weight:600;
  cursor:pointer; transition:opacity .15s,transform .1s; letter-spacing:.02em;
}
.btn:active { transform:scale(.98); }
.btn-go { background:linear-gradient(135deg,var(--blue),var(--indigo)); color:#fff; }
.btn-go:hover { opacity:.88; }
.btn-reload {
  background:transparent; border:1px solid var(--border); color:var(--muted);
  margin-top:6px; font-size:12px;
}
.btn-reload:hover { border-color:var(--green); color:var(--green); }
.btn-clr { background:transparent; border:1px solid var(--border); color:var(--muted); margin-top:6px; }
.btn-clr:hover { border-color:var(--muted); color:var(--text); }

/* ── Leyenda sectores ── */
#legend-wrap { flex:1; overflow-y:auto; padding:14px 16px; }
.leg-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.leg-item {
  display:flex; align-items:center; gap:7px; background:var(--panel2);
  border-radius:7px; padding:6px 8px; border:1px solid transparent; transition:border-color .15s;
}
.leg-item.active { border-color:#ffffff22; }
.leg-dot { width:11px; height:11px; border-radius:3px; flex-shrink:0; }
.leg-name { font-size:11px; font-weight:600; }
.leg-count { font-size:10px; color:var(--muted); font-family:var(--mono); }

/* ── MAPA ── */
#map { position:absolute; top:100px; left:0; right:0; bottom:0; }

/* Tooltip */
.lt-tip {
  background:var(--panel) !important; border:1px solid var(--border) !important;
  color:var(--text) !important; font-family:var(--mono) !important;
  font-size:11px !important; border-radius:8px !important;
  padding:7px 11px !important; box-shadow:0 4px 18px rgba(0,0,0,.5) !important;
  pointer-events:none !important;
}
.lt-tip b { color:#fff; }

/* ── POPUP ── */
.leaflet-popup-content-wrapper {
  background:var(--panel) !important; border:1px solid var(--border) !important;
  border-radius:14px !important; color:var(--text) !important;
  font-family:var(--sans) !important; box-shadow:0 12px 40px rgba(0,0,0,.7) !important;
  padding:0 !important; overflow:hidden !important;
}
.leaflet-popup-content { margin:0 !important; width:280px !important; }
.leaflet-popup-tip-container { display:none; }
.leaflet-popup-close-button { color:var(--muted) !important; top:10px !important; right:12px !important; font-size:18px !important; }

.popup-header {
  padding:14px 16px 12px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border);
}
.popup-sector-badge {
  width:36px; height:36px; border-radius:9px;
  display:grid; place-items:center; flex-shrink:0;
  font-size:14px; font-weight:700; color:#fff;
}
.popup-header-info .ph-label { font-size:9px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
.popup-header-info .ph-title { font-size:15px; font-weight:600; margin-top:1px; }

.popup-body { padding:10px 16px; display:flex; flex-direction:column; }
.popup-row { display:flex; align-items:flex-start; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); }
.popup-row:last-child { border-bottom:none; }
.pr-icon { font-size:13px; width:18px; text-align:center; margin-top:1px; flex-shrink:0; }
.pr-content { flex:1; min-width:0; }
.pr-key { font-size:9px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:2px; }
.pr-val { font-size:12px; font-weight:500; word-break:break-word; }

.popup-footer {
  background:var(--panel2); padding:7px 16px;
  display:flex; justify-content:space-between; align-items:center;
}
.pf-coords { font-size:10px; font-family:var(--mono); color:var(--muted); }
.pf-lote   { font-size:10px; font-family:var(--mono); color:var(--muted); }

.popup-multi { padding:10px 16px; }
.pm-title { font-size:10px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:8px; }
.pm-list { display:flex; flex-direction:column; gap:6px; max-height:200px; overflow-y:auto; }
.pm-card {
  background:var(--panel2); border-radius:8px; padding:9px 11px;
  border:1px solid var(--border); cursor:pointer; transition:border-color .15s;
}
.pm-card:hover { border-color:var(--blue); }
.pm-act { font-size:12px; font-weight:600; }
.pm-sub { font-size:10px; color:var(--muted); font-family:var(--mono); margin-top:3px; }

/* ── Indicador de última actualización ── */
#last-update {
  font-size:10px; font-family:var(--mono); color:var(--muted);
  padding:6px 16px; border-top:1px solid var(--border);
  display:flex; align-items:center; gap:6px; flex-shrink:0;
}
.upd-dot { width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0; }
.upd-dot.stale { background:var(--muted); }

/* ── Loader ── */
#loader {
  position:fixed; inset:0; background:var(--bg);
  display:grid; place-items:center; z-index:9999; transition:opacity .35s;
}
#loader.gone { opacity:0; pointer-events:none; }
.spin { width:42px; height:42px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--blue); animation:rot .7s linear infinite; margin:0 auto 14px; }
@keyframes rot { to { transform:rotate(360deg); } }
.spin-txt { font-family:var(--mono); font-size:12px; color:var(--muted); text-align:center; }

::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:9px; }
</style>
</head>
<body>

<div id="loader"><div><div class="spin"></div><div class="spin-txt">Cargando mapa y datos…</div></div></div>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="header-top">
      <div>
        <h1>Mapa interactivo San Borja</h1>
        <div class="district">Distrito de San Borja · Lima, Perú</div>
      </div>
      <div id="hdr-count">Sin datos</div>
    </div>
    <div class="header-legend">
      <div class="blk-title">Sectores</div>
      <div class="leg-grid" id="leg-grid"></div>
    </div>
  </header>

  <!-- MAPA -->
  <div id="map"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
// ══════════════════════════════════════════════════════
//  PALETA 12 SECTORES
// ══════════════════════════════════════════════════════
const SC = {
   1:'#e05252', 2:'#e07c3a', 3:'#d4b800', 4:'#6abf4b',
   5:'#27a86e', 6:'#1ea8a8', 7:'#3b8de8', 8:'#6b5de8',
   9:'#a34de8',10:'#e04da8',11:'#e84d6b',12:'#7a9e6e',
};

// Columnas del CSV (normalizadas)
const COL = {
  fecha:'fecha', latitud:'latitud', longitud:'longitud',
  direccion:'direccion', responsable:'responsable',
  participantes:'participantes', actividad:'actividad',
};

// ══════════════════════════════════════════════════════
//  ESTADO GLOBAL
// ══════════════════════════════════════════════════════
let map, lotesLayer, puntosLayer;
let lotesGeoJSON = null;
let rows = [];
let sectorCounts = {};
let activeSource = 'sheets';   // 'sheets' | 'file'
window._detectedSectorCol = null;

// ══════════════════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════════════════
// Elementos .stab removidos - eventos deshabilitados
// document.querySelectorAll('.stab').forEach(btn => { ... });

// ══════════════════════════════════════════════════════
//  MAPA
// ══════════════════════════════════════════════════════
function initMap() {
  map = L.map('map', { zoomControl:true, preferCanvas:true })
         .setView([-12.105,-76.990], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap contributors', maxZoom:19,
  }).addTo(map);
  loadLotes();
}

async function loadLotes() {
  try {
    const r = await fetch('Data/SAN_BORJA_LM_geogpsperu_SuyoPomalia.geojson');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    lotesGeoJSON = await r.json();
    lotesLayer = L.geoJSON(lotesGeoJSON, {
      style: defaultStyle,
      onEachFeature: bindLoteEvents,
    }).addTo(map);
    map.fitBounds(lotesLayer.getBounds(), { padding:[20,20] });
    document.getElementById('hdr-count').textContent =
      `${lotesGeoJSON.features.length.toLocaleString()} lotes`;

    // Cargar automáticamente datos de Google Sheets
    const sheetsUrl = document.getElementById('gs-url').value;
    if (sheetsUrl) {
      await fetchFromSheets(sheetsUrl);
    }
  } catch(e) {
    document.getElementById('hdr-count').textContent = '⚠ GeoJSON no encontrado';
    console.warn('lotes.geojson:', e.message);
  } finally {
    document.getElementById('loader').classList.add('gone');
  }
}

const defaultStyle = () => ({
  color:'#252d3d', weight:.8, fillColor:'#1a2035', fillOpacity:.6,
});

function bindLoteEvents(feature, layer) {
  layer.on({
    mouseover(e) {
      const s = feature.properties._sector;
      e.target.setStyle({ weight:2, color: s ? SC[s] : '#fff', fillOpacity:.92 });
      const tip = s
        ? `<b>Sector ${s}</b> · Lote #${feature.properties._lote_idx ?? '—'}<br>${feature.properties._puntos?.length ?? 0} registro(s)`
        : `Lote #${feature.properties._lote_idx ?? '—'} · Sin datos`;
      e.target.bindTooltip(tip, { className:'lt-tip', sticky:true }).openTooltip();
    },
    mouseout(e) { 
      const s = e.target.feature.properties._sector;
      e.target.setStyle(s ? { fillColor:SC[s], fillOpacity:.62, color:'#ffffff22', weight:.7 } : defaultStyle());
      e.target.closeTooltip(); 
    },
    click(e) {
      const pts = feature.properties._puntos;
      if (!pts?.length) return;
      pts.length === 1
        ? openSinglePopup(e.latlng, pts[0], feature)
        : openMultiPopup(e.latlng, pts, feature);
    },
  });
}

// ══════════════════════════════════════════════════════
//  POPUPS
// ══════════════════════════════════════════════════════
function openSinglePopup(latlng, row, feature) {
  const s = feature.properties._sector;
  const c = SC[s] || '#3b8de8';
  const lat = parseFloat(row[COL.latitud]).toFixed(5);
  const lon = parseFloat(row[COL.longitud]).toFixed(5);

  L.popup({ maxWidth:300, minWidth:280 })
   .setLatLng(latlng)
   .setContent(`
    <div>
      <div class="popup-header">
        <div class="popup-sector-badge" style="background:${c}">S${s}</div>
        <div class="popup-header-info">
          <div class="ph-label">Sector ${s} · Lote #${feature.properties._lote_idx ?? '—'}</div>
          <div class="ph-title">${row[COL.actividad] || 'Sin actividad'}</div>
        </div>
      </div>
      <div class="popup-body">
        <div class="popup-row">
          <div class="pr-icon">📅</div>
          <div class="pr-content"><div class="pr-key">Fecha</div><div class="pr-val">${row[COL.fecha] || '—'}</div></div>
        </div>
        <div class="popup-row">
          <div class="pr-icon">📍</div>
          <div class="pr-content"><div class="pr-key">Dirección</div><div class="pr-val">${row[COL.direccion] || '—'}</div></div>
        </div>
        <div class="popup-row">
          <div class="pr-icon">👤</div>
          <div class="pr-content"><div class="pr-key">Responsable</div><div class="pr-val">${row[COL.responsable] || '—'}</div></div>
        </div>
        <div class="popup-row">
          <div class="pr-icon">👥</div>
          <div class="pr-content"><div class="pr-key">Participantes</div><div class="pr-val">${row[COL.participantes] || '—'}</div></div>
        </div>
      </div>
      <div class="popup-footer">
        <span class="pf-coords">${lat}, ${lon}</span>
        <span class="pf-lote">Lote #${feature.properties._lote_idx ?? '—'}</span>
      </div>
    </div>`)
   .openOn(map);
}

function openMultiPopup(latlng, pts, feature) {
  const s = feature.properties._sector;
  const c = SC[s] || '#3b8de8';
  const cards = pts.map((row, i) => `
    <div class="pm-card" data-index="${i}">
      <div class="pm-act">${row[COL.actividad] || '—'}</div>
      <div class="pm-sub">${row[COL.fecha] || ''} · ${row[COL.responsable] || ''}</div>
    </div>`).join('');

  window._multiCtx = { pts, feature };

  const content = `
    <div>
      <div class="popup-header">
        <div class="popup-sector-badge" style="background:${c}">S${s}</div>
        <div class="popup-header-info">
          <div class="ph-label">Sector ${s} · Lote #${feature.properties._lote_idx ?? '—'}</div>
          <div class="ph-title">${pts.length} registros en este lote</div>
        </div>
      </div>
      <div class="popup-multi">
        <div class="pm-title">Selecciona un registro</div>
        <div class="pm-list" id="pm-list">${cards}</div>
      </div>
    </div>`;

  const popup = L.popup({ maxWidth:300, minWidth:280 })
   .setLatLng(latlng)
   .setContent(content)
   .openOn(map);

  // Attachar listeners después de que el popup se abre
  setTimeout(() => {
    const pmCards = document.querySelectorAll('.pm-card');
    pmCards.forEach(card => {
      card.addEventListener('click', () => {
        const index = parseInt(card.dataset.index, 10);
        window.openCardFromMap(index);
      });
    });
  }, 10);
}

window.openCardFromMap = (i) => {
  const { pts, feature } = window._multiCtx;
  const row = pts[i];
  const latlng = [parseFloat(row[COL.latitud]), parseFloat(row[COL.longitud])];
  openSinglePopup(latlng, row, feature);
};

// Elementos de menú removidos
// const menuToggle = null;
// const menuClose = null;
// const sidebarBackdrop = null;

// ══════════════════════════════════════════════════════
//  FUENTE: GOOGLE SHEETS
// ══════════════════════════════════════════════════════
async function fetchFromSheets(url) {
  setGsStatus('⏳ Conectando con Google Sheets…', 'loading');
  try {
    // Forzar formato CSV en la URL por si el usuario pegó otro formato
    let csvUrl = url.trim();
    if (csvUrl.includes('spreadsheets/d/') && !csvUrl.includes('output=csv')) {
      // Convertir URL de edición a URL de exportación CSV
      const idMatch = csvUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (idMatch) {
        csvUrl = `https://docs.google.com/spreadsheets/d/${idMatch[1]}/export?format=csv`;
      }
    }

    const resp = await fetch(csvUrl);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();

    const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
    if (!parsed.data.length) throw new Error('La hoja está vacía o el formato no es correcto.');

    ingestRows(parsed.data, 'Google Sheets');
    setGsStatus(`✓ ${parsed.data.length} registros cargados`, 'ok');
    setLastUpdate('Google Sheets');
  } catch(e) {
    setGsStatus(`✕ Error: ${e.message}`, 'err');
  }
}

// Elementos del sidebar removidos - event listeners deshabilitados
// document.getElementById('gs-url').addEventListener('keydown', ...
// document.getElementById('btn-reload').addEventListener('click', ...

function setGsStatus(msg, type) {
  const el = document.getElementById('gs-status');
  el.textContent = msg;
  el.className = type;
}

// ══════════════════════════════════════════════════════
//  FUENTE: ARCHIVO LOCAL
// ══════════════════════════════════════════════════════
// Elementos de file upload removidos - eventos deshabilitados
// const finput = document.getElementById('finput');
// const dz = document.getElementById('dz');
// ... event listeners deshabilitados

function processFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  setFstatus('⏳ Procesando…', false);
  if (ext === 'csv') {
    Papa.parse(file, {
      header:true, skipEmptyLines:true,
      complete(r) { ingestRows(r.data, file.name); setLastUpdate(file.name); },
      error(e)    { setFstatus('Error CSV: ' + e.message, true); },
    });
  } else if (['xlsx','xls'].includes(ext)) {
    const rd = new FileReader();
    rd.onload = e => {
      const wb = XLSX.read(e.target.result, { type:'binary' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      ingestRows(XLSX.utils.sheet_to_json(ws, { defval:'' }), file.name);
      setLastUpdate(file.name);
    };
    rd.readAsBinaryString(file);
  } else {
    setFstatus('Formato no soportado. Usa CSV o XLSX.', true);
  }
}

function setFstatus(msg, isErr) {
  const el = document.getElementById('fstatus');
  el.textContent = msg; el.className = isErr ? 'err' : 'ok';
}

// ══════════════════════════════════════════════════════
//  INGESTAR FILAS (común a ambas fuentes)
// ══════════════════════════════════════════════════════
function norm(k) {
  return k.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,'_').trim();
}

function ingestRows(data, sourceName) {
  rows = data.map(r => {
    const o = {};
    for (const k in r) o[norm(k)] = r[k];
    return o;
  });

  const cols = Object.keys(rows[0] || {});
  
  // Detectar automáticamente columna sector
  let autoCol = null;
  for (const c of cols) {
    if (c.toLowerCase().includes('sector')) {
      autoCol = c;
      break;
    }
  }
  if (!autoCol) {
    for (const c of cols) {
      const values = rows.map(r => parseInt(r[c], 10)).filter(v => !isNaN(v) && v >= 1 && v <= 12);
      if (values.length > rows.length * 0.5) {
        autoCol = c;
        break;
      }
    }
  }
  
  if (autoCol) {
    window._detectedSectorCol = autoCol;
    applyToMap();
  }
}

// ══════════════════════════════════════════════════════
//  APLICAR AL MAPA
// ══════════════════════════════════════════════════════
// Elemento btn-apply removido - evento deshabilitado
// document.getElementById('btn-apply').addEventListener('click', applyToMap);

function applyToMap() {
  if (!lotesGeoJSON) { alert('El archivo lotes.geojson no está cargado.'); return; }
  if (!rows.length)  { alert('Carga datos primero (Sheets o archivo).'); return; }

  const colSector = window._detectedSectorCol;
  if (!colSector) { alert('No se pudo detectar la columna de sector.'); return; }

  if (puntosLayer) { map.removeLayer(puntosLayer); puntosLayer = null; }
  lotesGeoJSON.features.forEach(f => { delete f.properties._sector; delete f.properties._puntos; });
  sectorCounts = {};

  const valid = rows.filter(r => {
    return !isNaN(parseFloat(r[COL.latitud])) && !isNaN(parseFloat(r[COL.longitud]));
  });

  valid.forEach(row => {
    const lat    = parseFloat(row[COL.latitud]);
    const lon    = parseFloat(row[COL.longitud]);
    const sector = parseInt(row[colSector], 10);
    if (isNaN(sector) || sector < 1 || sector > 12) return;

    const pt = turf.point([lon, lat]);
    for (const feat of lotesGeoJSON.features) {
      try {
        if (turf.booleanPointInPolygon(pt, feat)) {
          if (!feat.properties._puntos) {
            feat.properties._puntos = [];
            feat.properties._sector = sector;
          }
          feat.properties._puntos.push(row);
          sectorCounts[sector] = (sectorCounts[sector] || 0) + 1;
          break;
        }
      } catch(_) {}
    }
  });

  // Colorear lotes
  lotesLayer.eachLayer(layer => {
    const s = layer.feature.properties._sector;
    s ? layer.setStyle({ fillColor:SC[s], fillOpacity:.62, color:'#ffffff22', weight:.7 })
      : layer.setStyle(defaultStyle());
  });

  // Marcadores
  const markers = valid.map(row => {
    const lat    = parseFloat(row[COL.latitud]);
    const lon    = parseFloat(row[COL.longitud]);
    const sector = parseInt(row[colSector], 10);
    const color  = SC[sector] || '#aaa';
    const icon = L.divIcon({
      className:'',
      html:`<div style="width:9px;height:9px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6)"></div>`,
      iconSize:[9,9], iconAnchor:[4,4],
    });
    const m = L.marker([lat,lon], { icon });
    m.bindTooltip(`<b>Sector ${sector}</b> · ${row[COL.actividad]||'—'}`, { className:'lt-tip', sticky:true });
    m.on('click', () => {
      const feat = lotesGeoJSON.features.find(f => f.properties._puntos?.includes(row));
      if (feat) openSinglePopup([lat,lon], row, feat);
    });
    return m;
  });

  puntosLayer = L.layerGroup(markers).addTo(map);
  renderLegend();

  const lotes = lotesGeoJSON.features.filter(f => f.properties._sector).length;
  document.getElementById('hdr-count').textContent =
    `${lotesGeoJSON.features.length.toLocaleString()} lotes · ${valid.length} puntos · ${lotes} coloreados`;
}

// ══════════════════════════════════════════════════════
//  LIMPIAR
// ══════════════════════════════════════════════════════
function clearMap() {
  if (puntosLayer) { map.removeLayer(puntosLayer); puntosLayer = null; }
  if (lotesLayer) {
    lotesGeoJSON.features.forEach(f => { delete f.properties._sector; delete f.properties._puntos; });
    lotesLayer.eachLayer(l => lotesLayer.resetStyle(l));
  }
  map.closePopup();
  sectorCounts = {};
  initLegend();
  document.getElementById('hdr-count').textContent =
    `${(lotesGeoJSON?.features?.length||0).toLocaleString()} lotes`;
  setLastUpdate(null);
}
// Elemento btn-clear removido - función deshabilitada
// document.getElementById('btn-clear').addEventListener('click', clearMap);

// ══════════════════════════════════════════════════════
//  LEYENDA
// ══════════════════════════════════════════════════════
function renderLegend() {
  const grid = document.getElementById('leg-grid');
  grid.innerHTML = '';
  for (let s=1; s<=12; s++) {
    const n = sectorCounts[s] || 0;
    const div = document.createElement('div');
    div.className = 'leg-item' + (n ? ' active' : '');
    div.innerHTML = `
      <div class="leg-dot" style="background:${SC[s]}"></div>
      <div>
        <div class="leg-name">Sector ${s}</div>
        <div class="leg-count">${n} punto${n!==1?'s':''}</div>
      </div>`;
    grid.appendChild(div);
  }
}

function initLegend() {
  const grid = document.getElementById('leg-grid');
  grid.innerHTML = '';
  for (let s=1; s<=12; s++) {
    const div = document.createElement('div');
    div.className = 'leg-item';
    div.innerHTML = `
      <div class="leg-dot" style="background:${SC[s]}"></div>
      <div><div class="leg-name">Sector ${s}</div><div class="leg-count">—</div></div>`;
    grid.appendChild(div);
  }
}

// ══════════════════════════════════════════════════════
//  INDICADOR DE ÚLTIMA ACTUALIZACIÓN
// ══════════════════════════════════════════════════════
function setLastUpdate(source) {
  const dot = document.getElementById('upd-dot');
  const txt = document.getElementById('upd-txt');
  if (!source) {
    dot.className = 'upd-dot stale';
    txt.textContent = 'Sin datos cargados';
    return;
  }
  const now = new Date().toLocaleTimeString('es-PE', { hour:'2-digit', minute:'2-digit' });
  dot.className = 'upd-dot';
  txt.textContent = `Actualizado ${now} · ${source}`;
}

// ══════════════════════════════════════════════════════
//  ARRANCAR
// ══════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {

  initLegend();
  initMap();
});
</script>
