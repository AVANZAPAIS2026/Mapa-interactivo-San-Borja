<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Roberth Montoya | Índices de Criminalidad San Borja</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <link rel="stylesheet" href="css/styles.css?v=20260522-landing"/>
</head>
<body class="map-page">
  <nav class="site-nav" aria-label="Navegación principal">
    <div class="nav-inner">
      <a class="brand" href="index.html" aria-label="Ir al inicio">
        <span class="brand-mark">RM</span>
        <span>Roberth Montoya</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu">
        <li><a class="nav-link" href="index.html">Inicio</a></li>
        <li><a class="nav-link" href="avance-campana.html">Avance Campaña</a></li>
        <li><a class="nav-link" href="presencia-publicitaria.html">Presencia Publicitaria</a></li>
        <li><a class="nav-link active" href="indices-criminalidad-san-borja.html" aria-current="page">Índices de Criminalidad</a></li>
        <li><a class="nav-link" href="sectores.html">Sectores y Sub-sectores</a></li>
        <li><a class="nav-link" href="actividades.html">Actividades</a></li>
      </ul>
    </div>
  </nav>

  <div id="loader"><div><div class="spin"></div><div class="spin-txt">Cargando mapa y datos...</div></div></div>

  <header class="map-header">
    <div class="map-header-top">
      <div class="map-title">
        <h1>Índices de Criminalidad San Borja</h1>
        <div class="district">Distrito de San Borja · Lima, Perú</div>
      </div>
      <div id="hdr-count">Sin datos</div>
    </div>
    <div class="header-legend">
      <div class="blk-title">Tipos de incidencia</div>
      <div class="leg-grid" id="leg-grid"></div>
    </div>
  </header>

  <div id="map"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
    // Control del menú responsive compartido.
    const nav = document.querySelector('.site-nav');
    const toggle = document.querySelector('.nav-toggle');
    toggle.addEventListener('click', () => {
      const isOpen = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', String(isOpen));
    });

    // Columnas esperadas de la hoja, normalizadas a minúsculas y sin tildes.
    const COL = {
      fecha: 'fecha',
      latitud: 'latitud',
      longitud: 'longitud',
      direccion: 'direccion',
      subsector: 'subsector',
      tipo: 'tipo_de_incidencia',
      presenciaAutoridades: 'presencia_de_las_autoridades',
      tiempoLlegada: 'tiempo_de_llegada_de_las_autoridades_aprox_y_en_minutos',
    };

    const LAT_KEYS = ['latitud', 'latitude', 'lat'];
    const LON_KEYS = ['longitud', 'longitude', 'lng', 'lon', 'long'];
    const GEOPOINT_KEYS = ['geopoint', 'geo_point', 'geo_point_2d', 'coordenadas', 'coordenada', 'ubicacion', 'ubicacion_gps', 'punto_gps'];
    const ARRIVAL_TIME_KEYS = [
      'tiempo_de_llegada_de_las_autoridades_aprox_y_en_minutos',
      'tiempo_de_llegada_de_las_autoridades_aprox_en_minutos',
      'tiempo_de_llegada_de_las_autoridades_aprox',
      'tiempo_de_llegada_de_las_autoridades',
      'tiempo_de_llegada',
    ];

    const GEOJSON_LAYER_COLOR = '#454546';
    const INCIDENCE_COLOR_PALETTE = [
      '#DB1774',
      '#2563EB',
      '#F59E0B',
      '#16A34A',
      '#7C3AED',
      '#DC2626',
      '#0891B2',
      '#EA580C',
      '#4F46E5',
      '#65A30D',
      '#BE185D',
      '#0F766E',
    ];
    const SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQcCVzStyWMu3K5-IpG1z_rMDRmpmAnRG9nmSD_nzM6j6B_NoO2o0sSvqqETBf8TrA43J-pLqD3G8Vx/pub?gid=187452132&single=true&output=tsv';
    const GEOJSON_PATHS = [
      'data/SAN_BORJA_LM_geogpsperu_SuyoPomalia.geojson',
    ];

    let map, lotesLayer, puntosLayer;
    let lotesGeoJSON = null;
    let rows = [];
    let incidenceColors = {};
    let incidenceCounts = {};
    window._detectedIncidenceCol = null;

    function initMap() {
      map = L.map('map', { zoomControl: true })
        .setView([-12.105, -76.990], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);

      loadLotes();
    }

    async function loadLotes() {
      try {
        const loaded = await fetchFirstGeoJSON(GEOJSON_PATHS);
        lotesGeoJSON = loaded.data;
        lotesLayer = L.geoJSON(lotesGeoJSON, {
          style: geojsonLayerStyle,
          onEachFeature: bindLoteEvents,
        }).addTo(map);

        if (lotesGeoJSON.features && lotesGeoJSON.features.length > 0) {
          map.fitBounds(lotesLayer.getBounds(), { padding: [20, 20] });
        }

        document.getElementById('hdr-count').textContent =
          `${lotesGeoJSON.features.length.toLocaleString()} lotes cargados`;
        console.info(`GeoJSON cargado desde: ${loaded.path}`);

        if (SHEETS_URL) {
          fetchFromSheets(SHEETS_URL).catch(err => console.error('Error en Sheets:', err));
        }
      } catch (e) {
        document.getElementById('hdr-count').textContent = `Error: ${e.message}`;
        console.error('Detalle del error:', e);
      } finally {
        document.getElementById('loader').classList.add('gone');
      }
    }

    async function fetchFirstGeoJSON(paths) {
      const errors = [];
      for (const path of paths) {
        try {
          const resp = await fetch(path, { cache: 'no-cache' });
          if (!resp.ok) {
            errors.push(`${path}: HTTP ${resp.status}`);
            continue;
          }
          const data = await resp.json();
          if (!data || !Array.isArray(data.features)) {
            errors.push(`${path}: GeoJSON inválido`);
            continue;
          }
          return { path, data };
        } catch (err) {
          errors.push(`${path}: ${err.message}`);
        }
      }
      throw new Error(`GeoJSON no encontrado. Revisé: ${errors.join(' | ')}`);
    }

    function getLotFillColor(feature) {
      return feature?.properties?._incidence_color || GEOJSON_LAYER_COLOR;
    }

    function getRowFillColor(row) {
      return getIncidenceColor(row?.[window._detectedIncidenceCol || COL.tipo]);
    }

    function geojsonLayerStyle(feature) {
      return {
        color: GEOJSON_LAYER_COLOR,
        weight: .8,
        fillColor: getLotFillColor(feature),
        fillOpacity: .45,
      };
    }

    function paintedLotStyle(feature) {
      return {
        color: GEOJSON_LAYER_COLOR,
        weight: .8,
        fillColor: getLotFillColor(feature),
        fillOpacity: .6,
      };
    }

    function bindLoteEvents(feature, layer) {
      layer.on({
        mouseover(e) {
          const incidence = feature.properties._incidence;
          const fillColor = incidence ? getLotFillColor(feature) : GEOJSON_LAYER_COLOR;
          e.target.setStyle({ weight: 2, color: GEOJSON_LAYER_COLOR, fillColor, fillOpacity: .92 });
          const tip = incidence
            ? `<b>${incidence}</b> · Lote #${feature.properties._lote_idx ?? '-'}<br>${feature.properties._puntos?.length ?? 0} registro(s)`
            : `Lote #${feature.properties._lote_idx ?? '-'} · Sin datos`;
          e.target.bindTooltip(tip, { className: 'lt-tip', sticky: true }).openTooltip();
        },
        mouseout(e) {
          e.target.setStyle(e.target.feature.properties._incidence ? paintedLotStyle(e.target.feature) : geojsonLayerStyle(e.target.feature));
          e.target.closeTooltip();
        },
        click(e) {
          const pts = feature.properties._puntos;
          if (!pts?.length) return;
          pts.length === 1
            ? openSinglePopup(e.latlng, pts[0], feature)
            : openMultiPopup(e.latlng, pts, feature);
        },
      });
    }

    function openSinglePopup(latlng, row, feature) {
      const incidenceCol = window._detectedIncidenceCol || COL.tipo;
      const incidence = row[incidenceCol] || feature.properties._incidence || 'Sin incidencia';
      const coords = getRowLatLon(row);
      const lat = coords ? coords.lat.toFixed(5) : '-';
      const lon = coords ? coords.lon.toFixed(5) : '-';

      L.popup({ maxWidth: 300, minWidth: 280 })
        .setLatLng(latlng)
        .setContent(`
          <div>
            <div class="popup-header">
              <div class="popup-sector-badge" style="background:${getIncidenceColor(incidence)}"></div>
              <div class="popup-header-info">
                <div class="ph-label">Lote #${feature.properties._lote_idx ?? '-'}</div>
                <div class="ph-title">${incidence}</div>
              </div>
            </div>
            <div class="popup-body">
              <div class="popup-row">
                <div class="pr-icon">F</div>
                <div class="pr-content"><div class="pr-key">Fecha</div><div class="pr-val">${row[COL.fecha] || '-'}</div></div>
              </div>
              <div class="popup-row">
                <div class="pr-icon">T</div>
                <div class="pr-content"><div class="pr-key">Tipo de incidencia</div><div class="pr-val">${incidence}</div></div>
              </div>
              <div class="popup-row">
                <div class="pr-icon">D</div>
                <div class="pr-content"><div class="pr-key">Dirección</div><div class="pr-val">${row[COL.direccion] || '-'}</div></div>
              </div>
              <div class="popup-row">
                <div class="pr-icon">Z</div>
                <div class="pr-content"><div class="pr-key">Subsector</div><div class="pr-val">${row[COL.subsector] || '-'}</div></div>
              </div>
              <div class="popup-row">
                <div class="pr-icon">A</div>
                <div class="pr-content"><div class="pr-key">Presencia de autoridades</div><div class="pr-val">${row[COL.presenciaAutoridades] || '-'}</div></div>
              </div>
              <div class="popup-row">
                <div class="pr-icon">M</div>
                <div class="pr-content"><div class="pr-key">Tiempo de llegada</div><div class="pr-val">${getRowField(row, ARRIVAL_TIME_KEYS) || '-'}</div></div>
              </div>
            </div>
            <div class="popup-footer">
              <span class="pf-coords">${lat}, ${lon}</span>
              <span class="pf-lote">Lote #${feature.properties._lote_idx ?? '-'}</span>
            </div>
          </div>`)
        .openOn(map);
    }

    function openMultiPopup(latlng, pts, feature) {
      const incidenceCol = window._detectedIncidenceCol || COL.tipo;
      const incidence = feature.properties._incidence || '-';
      const cards = pts.map((row, i) => `
        <div class="pm-card" data-index="${i}">
          <div class="pm-act">${row[incidenceCol] || '-'}</div>
          <div class="pm-sub">${row[COL.direccion] || ''}</div>
        </div>`).join('');

      window._multiCtx = { pts, feature };

      const popup = L.popup({ maxWidth: 300, minWidth: 280 })
        .setLatLng(latlng)
        .setContent(`
          <div>
            <div class="popup-header">
              <div class="popup-sector-badge" style="background:${getIncidenceColor(incidence)}"></div>
              <div class="popup-header-info">
                <div class="ph-label">${incidence} · Lote #${feature.properties._lote_idx ?? '-'}</div>
                <div class="ph-title">${pts.length} registros en este lote</div>
              </div>
            </div>
            <div class="popup-multi">
              <div class="pm-title">Selecciona un registro</div>
              <div class="pm-list" id="pm-list">${cards}</div>
            </div>
          </div>`);

      popup.on('add', function() {
        const root = popup.getElement();
        const pmCards = root ? root.querySelectorAll('.pm-card') : [];
        pmCards.forEach(card => {
          card.addEventListener('click', () => {
            const index = parseInt(card.dataset.index, 10);
            window.openCardFromMap(index);
          });
        });
      });

      popup.openOn(map);
    }

    window.openCardFromMap = (i) => {
      const { pts, feature } = window._multiCtx;
      const row = pts[i];
      const coords = getRowLatLon(row);
      const latlng = coords ? [coords.lat, coords.lon] : map.getCenter();
      openSinglePopup(latlng, row, feature);
    };

    async function fetchFromSheets(url) {
      try {
        const targetUrl = normalizeSheetsUrl(url);
        const resp = await fetch(targetUrl, { cache: 'no-cache' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const text = await resp.text();
        const parsed = Papa.parse(text, { header: true, skipEmptyLines: true, delimiter: '' });
        if (!parsed.data.length) throw new Error('La hoja está vacía o el formato no es correcto.');

        ingestRows(parsed.data, 'Google Sheets');
      } catch (e) {
        console.error(`Error al cargar Google Sheets: ${e.message}`);
        if (lotesGeoJSON?.features) {
          document.getElementById('hdr-count').textContent =
            `${lotesGeoJSON.features.length.toLocaleString()} lotes · 0 puntos · 0 coloreados`;
        }
      }
    }

    function normalizeSheetsUrl(url) {
      const value = String(url || '').trim();
      if (!value) throw new Error('No se proporcionó una URL válida.');
      if (value.includes('/pub?') || value.includes('output=csv') || value.includes('output=tsv')) return value;
      const idMatch = value.match(/\/d\/([a-zA-Z0-9-_]+)/);
      return idMatch ? `https://docs.google.com/spreadsheets/d/${idMatch[1]}/export?format=csv` : value;
    }

    function norm(k) {
      return k.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^\w]+/g, '_')
        .replace(/^_+|_+$/g, '')
        .trim();
    }

    function parseNumber(value) {
      if (value === null || value === undefined) return NaN;
      if (typeof value === 'number') return value;
      const cleaned = String(value)
        .trim()
        .replace(',', '.')
        .match(/-?\d+(?:\.\d+)?/);
      return cleaned ? parseFloat(cleaned[0]) : NaN;
    }

    function findValue(row, keys) {
      for (const key of keys) {
        if (row[key] !== undefined && row[key] !== '') return row[key];
      }
      return undefined;
    }

    function getRowField(row, keys) {
      return findValue(row, keys);
    }

    function parseGeoPoint(value) {
      if (value === null || value === undefined || value === '') return null;

      if (typeof value === 'object') {
        const lat = parseNumber(value.latitude ?? value.lat ?? value._lat);
        const lon = parseNumber(value.longitude ?? value.lng ?? value.lon ?? value.long ?? value._long);
        return makeLatLon(lat, lon);
      }

      const text = String(value).trim();
      const namedLat = text.match(/(?:latitud|latitude|lat)\s*[:=]\s*(-?\d+(?:[.,]\d+)?)/i);
      const namedLon = text.match(/(?:longitud|longitude|lng|lon|long)\s*[:=]\s*(-?\d+(?:[.,]\d+)?)/i);
      if (namedLat && namedLon) {
        const lat = parseNumber(namedLat[1]);
        const lon = parseNumber(namedLon[1]);
        return makeLatLon(lat, lon);
      }

      const nums = text.match(/-?\d+(?:[.,]\d+)?/g);
      if (!nums || nums.length < 2) return null;

      const first = parseNumber(nums[0]);
      const second = parseNumber(nums[1]);
      return makeLatLon(first, second);
    }

    function makeLatLon(first, second) {
      if (isValidLatLon(first, second)) {
        if (Math.abs(first) > 60 && Math.abs(second) < 30) return { lat: second, lon: first };
        return { lat: first, lon: second };
      }
      if (isValidLatLon(second, first)) return { lat: second, lon: first };
      return null;
    }

    function isValidLatLon(lat, lon) {
      return Number.isFinite(lat) && Number.isFinite(lon)
        && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
    }

    function getRowLatLon(row) {
      const lat = parseNumber(findValue(row, LAT_KEYS));
      const lon = parseNumber(findValue(row, LON_KEYS));
      const directCoords = makeLatLon(lat, lon);
      if (directCoords) return directCoords;

      for (const key of GEOPOINT_KEYS) {
        const coords = parseGeoPoint(row[key]);
        if (coords) return coords;
      }

      for (const value of Object.values(row)) {
        const coords = parseGeoPoint(value);
        if (coords) return coords;
      }

      return null;
    }

    function ingestRows(data, sourceName) {
      rows = data.map(r => {
        const o = {};
        for (const k in r) o[norm(k)] = r[k];
        return o;
      });

      const cols = Object.keys(rows[0] || {});
      const autoCol = cols.find(c => c === COL.tipo)
        || cols.find(c => c.includes('tipo') && c.includes('incidencia'))
        || cols.find(c => c.includes('incidencia'))
        || cols.find(c => c.includes('tipo'));

      window._detectedIncidenceCol = autoCol || COL.tipo;
      applyToMap();
    }

    function applyToMap() {
      if (!lotesGeoJSON || !rows.length) return;

      const incidenceCol = window._detectedIncidenceCol || COL.tipo;
      if (puntosLayer) {
        map.removeLayer(puntosLayer);
        puntosLayer = null;
      }

      lotesGeoJSON.features.forEach(f => {
        delete f.properties._incidence;
        delete f.properties._incidence_color;
        delete f.properties._puntos;
      });
      incidenceCounts = {};

      const valid = rows
        .map(row => ({ row, coords: getRowLatLon(row), incidence: String(row[incidenceCol] || '').trim() }))
        .filter(item => item.coords && item.incidence);

      const invalidCoords = rows.length - valid.length;
      if (invalidCoords > 0) {
        console.warn(`${invalidCoords} fila(s) sin coordenadas válidas. Revisa columnas latitud/longitud o geopoint.`);
      }

      valid.forEach(({ row, coords, incidence }) => {
        const { lat, lon } = coords;
        const color = getIncidenceColor(incidence);
        incidenceCounts[incidence] = (incidenceCounts[incidence] || 0) + 1;

        const pt = turf.point([lon, lat]);
        for (const feat of lotesGeoJSON.features) {
          try {
            if (turf.booleanPointInPolygon(pt, feat)) {
              if (!feat.properties._puntos) {
                feat.properties._puntos = [];
                feat.properties._incidence = incidence;
                feat.properties._incidence_color = color;
              }
              feat.properties._puntos.push(row);
              break;
            }
          } catch (_) {}
        }
      });

      lotesLayer.eachLayer(layer => {
        layer.setStyle(layer.feature.properties._incidence ? paintedLotStyle(layer.feature) : geojsonLayerStyle(layer.feature));
      });

      const markers = valid.map(({ row, coords, incidence }) => {
        const { lat, lon } = coords;
        const icon = L.divIcon({
          className: '',
          html: `<div style="width:9px;height:9px;border-radius:50%;background:${getIncidenceColor(incidence)};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)"></div>`,
          iconSize: [9, 9],
          iconAnchor: [4, 4],
        });
        const m = L.marker([lat, lon], { icon });
        m.bindTooltip(`<b>${incidence}</b> · ${row[COL.direccion] || '-'}`, { className: 'lt-tip', sticky: true });
        m.on('click', () => {
          const feat = lotesGeoJSON.features.find(f => f.properties._puntos?.includes(row));
          if (feat) openSinglePopup([lat, lon], row, feat);
        });
        return m;
      });

      puntosLayer = L.layerGroup(markers).addTo(map);
      renderLegend();

      const lotes = lotesGeoJSON.features.filter(f => f.properties._incidence).length;
      document.getElementById('hdr-count').textContent =
        `${lotesGeoJSON.features.length.toLocaleString()} lotes · ${valid.length} puntos · ${lotes} coloreados`;
    }

    function renderLegend() {
      const grid = document.getElementById('leg-grid');
      grid.innerHTML = '';
      const entries = Object.entries(incidenceCounts)
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'es'));

      if (!entries.length) {
        const div = document.createElement('div');
        div.className = 'leg-item';
        div.innerHTML = `
          <div class="leg-dot"></div>
          <div>
            <div class="leg-name">Sin incidencias</div>
            <div class="leg-count">-</div>
          </div>`;
        grid.appendChild(div);
        return;
      }

      for (const [incidence, n] of entries) {
        const div = document.createElement('div');
        div.className = 'leg-item active';
        div.innerHTML = `
          <div class="leg-dot" style="background:${getIncidenceColor(incidence)}"></div>
          <div>
            <div class="leg-name">${incidence}</div>
            <div class="leg-count">${n} punto${n !== 1 ? 's' : ''}</div>
          </div>`;
        grid.appendChild(div);
      }
    }

    function normalizeIncidenceName(value) {
      return String(value || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function getIncidenceColor(incidence) {
      const key = normalizeIncidenceName(incidence);
      if (!key) return GEOJSON_LAYER_COLOR;
      if (!incidenceColors[key]) {
        const used = Object.keys(incidenceColors).length;
        incidenceColors[key] = INCIDENCE_COLOR_PALETTE[used % INCIDENCE_COLOR_PALETTE.length];
      }
      return incidenceColors[key];
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderLegend();
      initMap();
    });
  </script>
</body>
</html>
