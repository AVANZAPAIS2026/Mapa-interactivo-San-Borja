<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roberth Montoya | Zonificación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
    <link rel="stylesheet" href="css/styles.css?v=20260522-landing"/>
</head>
<body class="map-page placeholder-map">
    <nav class="site-nav" aria-label="Navegación principal">
        <div class="nav-inner">
            <a class="brand" href="index.html" aria-label="Ir al inicio">
                <span class="brand-mark">RM</span>
                <span>Roberth Montoya</span>
            </a>
            <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-menu">
                <li><a class="nav-link" href="index.html">Inicio</a></li>
                <li><a class="nav-link" href="avance-campana.html">Avance Campaña</a></li>
                <li class="nav-disabled-wrap" title="Próximamente"><span class="nav-link disabled active" aria-current="page">Zonificación</span></li>
                <li><a class="nav-link" href="sectores.html">Sectores y Sub-sectores</a></li>
                <li><a class="nav-link" href="oposicion.html">Oposición</a></li>
                <li><a class="nav-link" href="actividades.html">Actividades</a></li>
            </ul>
        </div>
    </nav>

    <div id="map"></div>
    <div class="map-overlay">
        <svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 10V8a5 5 0 0 1 10 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 14v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Capa de Zonificación en preparación — Disponible próximamente</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const nav = document.querySelector('.site-nav');
        const toggle = document.querySelector('.nav-toggle');
        toggle.addEventListener('click', () => {
            const isOpen = nav.classList.toggle('open');
            toggle.setAttribute('aria-expanded', String(isOpen));
        });

        const map = L.map('map', { zoomControl: true }).setView([-12.1058, -76.9986], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19,
        }).addTo(map);
    </script>
</body>
</html>
